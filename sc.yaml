# sc.yaml

# Тот же том, но подключён через StorageClass.
# Порядок объектов: StorageClass, PersistentVolume, PersistentVolumeClaim, Deployment.

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: manual-hostpath
# кластер тома не создаёт, том готовим сами
provisioner: kubernetes.io/no-provisioner
# том свяжется с заявкой после появления пода
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-sc-hostpath
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-hostpath
  hostPath:
    # папка на узле кластера
    path: /tmp/k8s-sc-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-sc-hostpath
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  # класс должен совпадать с классом тома выше
  storageClassName: manual-hostpath
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-sc
  template:
    metadata:
      labels:
        app: data-exchange-sc
        task: sc
    spec:
      containers:
      # пишет дату в файл на томе каждые 5 секунд
      - name: busybox
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
          - "touch /data/data.txt; while true; do date >> /data/data.txt; sleep 5; done"
        volumeMounts:
        - name: sc-data
          mountPath: /data
      # читает тот же файл
      - name: multitool
        image: wbitt/network-multitool
        command: ["/bin/sh", "-c"]
        args:
          - "touch /data/data.txt; tail -f /data/data.txt"
        volumeMounts:
        - name: sc-data
          mountPath: /data
      volumes:
      - name: sc-data
        persistentVolumeClaim:
          claimName: pvc-sc-hostpath
