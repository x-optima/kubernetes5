# pv-pvc.yaml

# Ручной том на узле кластера и заявка на него.
# Три объекта: PersistentVolume, PersistentVolumeClaim, Deployment.

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-hostpath
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  # после удаления заявки том и данные остаются
  persistentVolumeReclaimPolicy: Retain
  # том не относится ни к одному StorageClass
  storageClassName: ""
  hostPath:
    # папка на узле кластера
    path: /tmp/k8s-pv-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-hostpath
spec:
  # заявка идёт строго к тому с именем pv-hostpath
  volumeName: pv-hostpath
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  # без этой строки кластер подставит StorageClass по умолчанию
  storageClassName: ""
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
        task: pv-pvc
    spec:
      containers:
      # пишет дату в файл на томе каждые 5 секунд
      - name: busybox
        image: busybox:1.36
        command: ["/bin/sh", "-c"]
        args:
          - "touch /data/data.txt; while true; do date >> /data/data.txt; sleep 5; done"
        volumeMounts:
        - name: persistent-data
          mountPath: /data
      # читает тот же файл
      - name: multitool
        image: wbitt/network-multitool
        command: ["/bin/sh", "-c"]
        args:
          - "touch /data/data.txt; tail -f /data/data.txt"
        volumeMounts:
        - name: persistent-data
          mountPath: /data
      volumes:
      - name: persistent-data
        persistentVolumeClaim:
          claimName: pvc-hostpath
